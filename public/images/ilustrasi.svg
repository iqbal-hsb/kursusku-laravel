<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
    <!-- Latar Belakang Abstrak -->
    <circle cx="300" cy="250" r="220" fill="#e8f5e9" />
    <circle cx="150" cy="150" r="40" fill="#c8e6c9" opacity="0.6"/>
    <circle cx="480" cy="380" r="60" fill="#c8e6c9" opacity="0.4"/>
    
    <!-- Meja -->
    <rect x="150" y="380" width="300" height="15" rx="5" fill="#795548" />
    <rect x="170" y="395" width="10" height="60" fill="#5d4037" />
    <rect x="420" y="395" width="10" height="60" fill="#5d4037" />

    <!-- Laptop -->
    <rect x="220" y="270" width="160" height="110" rx="10" fill="#37474f" />
    <rect x="230" y="280" width="140" height="90" rx="5" fill="#eceff1" />
    <rect x="200" y="380" width="200" height="10" rx="5" fill="#263238" />
    
    <!-- Layar Laptop (Kode) -->
    <rect x="240" y="290" width="40" height="5" rx="2" fill="#198754" />
    <rect x="240" y="305" width="80" height="5" rx="2" fill="#ced4da" />
    <rect x="240" y="320" width="60" height="5" rx="2" fill="#ced4da" />
    <rect x="240" y="335" width="90" height="5" rx="2" fill="#20c997" />
    <rect x="240" y="350" width="50" height="5" rx="2" fill="#ced4da" />

    <!-- Karakter (Orang) -->
    <!-- Badan -->
    <path d="M 330 270 Q 350 200 310 180 Q 270 200 290 270 Z" fill="#1e88e5" />
    <!-- Kepala -->
    <circle cx="310" cy="150" r="35" fill="#ffcc80" />
    <!-- Rambut -->
    <path d="M 275 150 A 35 35 0 0 1 345 150 Q 340 110 310 110 Q 280 110 275 150 Z" fill="#3e2723" />
    <!-- Tangan Kanan -->
    <path d="M 290 230 Q 260 250 250 300" fill="none" stroke="#ffcc80" stroke-width="15" stroke-linecap="round" />
    <!-- Tangan Kiri -->
    <path d="M 330 230 Q 360 250 370 300" fill="none" stroke="#ffcc80" stroke-width="15" stroke-linecap="round" />
    <!-- Kaki -->
    <rect x="285" y="260" width="20" height="40" rx="5" fill="#3e2723" />
    <rect x="315" y="260" width="20" height="40" rx="5" fill="#3e2723" />

    <!-- Buku di Kiri -->
    <rect x="110" y="350" width="70" height="30" rx="3" fill="#e53935" />
    <rect x="115" y="340" width="70" height="30" rx="3" fill="#43a047" />
    <rect x="120" y="330" width="70" height="30" rx="3" fill="#1e88e5" />

    <!-- Tanaman di Kanan -->
    <rect x="470" y="340" width="40" height="40" rx="5" fill="#8d6e63" />
    <path d="M 490 340 Q 490 300 470 280 Q 500 290 490 340" fill="#4caf50" />
    <path d="M 490 340 Q 490 290 510 270 Q 500 300 490 340" fill="#66bb6a" />

    <!-- Elemen Mengambang (Kode/Teknologi) -->
    <text x="120" y="200" font-family="monospace" font-size="24" fill="#198754" opacity="0.6">&lt;/&gt;</text>
    <text x="450" y="150" font-family="monospace" font-size="20" fill="#f57c00" opacity="0.6">{ }</text>
    <text x="100" y="280" font-family="monospace" font-size="18" fill="#1e88e5" opacity="0.6">( )</text>
    <text x="480" y="240" font-family="monospace" font-size="22" fill="#9c27b0" opacity="0.6">[ ]</text>
</svg>